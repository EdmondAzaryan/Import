<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Серый Импорт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #2a0f4a 0%, #14002b 40%, #0a0015 100%);
    color:#fff; min-height:100vh; padding-bottom:80px; overflow-x:hidden;
}
.header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; background:rgba(30,10,60,0.85);
    backdrop-filter:blur(10px); position:sticky; top:0; z-index:100;
    border-bottom:1px solid rgba(150,80,255,0.25);
}
.header-left { display:flex; align-items:center; gap:12px; }
.back-btn {
    width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:18px; border:none; color:#fff;
}
.back-btn:active { transform:scale(0.9); }
.header-title { font-size:16px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
.header-stats { display:flex; gap:6px; font-size:11px; font-weight:700; }
.stat-item {
    display:flex; align-items:center; gap:3px;
    background:rgba(0,0,0,0.35); padding:5px 8px; border-radius:20px;
    border:1px solid rgba(150,80,255,0.3);
}
.stat-item.money { color:#4ade80; }
.stat-item.gcoins { color:#facc15; }
.stat-item.tickets { color:#fbbf24; }

.containers-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px 14px;
}
.container-card {
    background:linear-gradient(155deg,#2d1155 0%,#1a0538 100%);
    border-radius:18px; padding:16px 12px; text-align:center;
    border:2px solid; position:relative; overflow:hidden; cursor:pointer;
    transition:0.25s; box-shadow:0 6px 24px rgba(0,0,0,0.5);
}
.container-card:active { transform:scale(0.97); }
.container-card.supercar { border-color:#facc15; box-shadow:0 0 25px rgba(250,204,21,0.4); }
.container-card.gold { border-color:#e5e7eb; box-shadow:0 0 25px rgba(229,231,235,0.35); }
.container-card.performance { border-color:#ef4444; box-shadow:0 0 25px rgba(239,68,68,0.4); }
.container-card.steel { border-color:#22c55e; box-shadow:0 0 25px rgba(34,197,94,0.4); }
.container-name { font-size:10px; font-weight:600; letter-spacing:1px; opacity:0.7; text-transform:uppercase; }
.container-title { font-size:13px; font-weight:900; margin-top:4px; text-transform:uppercase; }
.container-img {
    width:100%; height:80px; margin:12px 0;
    display:flex; align-items:center; justify-content:center;
    font-size:50px;
}
.container-price {
    display:inline-block; padding:8px 16px; border-radius:12px;
    font-weight:900; font-size:13px; margin-top:8px; width:100%;
}
.container-card.supercar .container-price { background:linear-gradient(135deg,#facc15,#f59e0b); color:#000; }
.container-card.gold .container-price { background:linear-gradient(135deg,#e5e7eb,#9ca3af); color:#000; }
.container-card.performance .container-price { background:linear-gradient(135deg,#a855f7,#7c3aed); color:#fff; }
.container-card.steel .container-price { background:linear-gradient(135deg,#22c55e,#16a34a); color:#000; }

.roulette-screen { display:none; padding:14px; }
.roulette-header { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.roulette-prize-box {
    background:linear-gradient(155deg,#2d1155,#1a0538);
    border:2px solid #a855f7; border-radius:16px; padding:14px;
    box-shadow:0 0 20px rgba(168,85,247,0.4);
}
.roulette-prize-box .label { font-size:10px; letter-spacing:1px; opacity:0.7; text-transform:uppercase; }
.roulette-prize-box .prize-name { font-size:13px; font-weight:900; margin-top:4px; }
.roulette-prize-box .prize-chance { font-size:10px; color:#a855f7; margin-top:2px; }
.roulette-guarantee {
    background:linear-gradient(155deg,#2d1155,#1a0538);
    border:2px solid #facc15; border-radius:16px; padding:14px;
    text-align:center; box-shadow:0 0 20px rgba(250,204,21,0.35);
}
.roulette-guarantee .g-label { font-size:10px; letter-spacing:1px; opacity:0.7; text-transform:uppercase; }
.roulette-guarantee .g-count { font-size:22px; font-weight:900; color:#facc15; margin-top:4px; }

.prizes-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
.prize-item {
    background:linear-gradient(155deg,#2d1155,#1a0538);
    border:1px solid rgba(168,85,247,0.4); border-radius:12px;
    padding:10px 6px; text-align:center; font-size:10px; font-weight:700;
    min-height:90px; display:flex; flex-direction:column;
    justify-content:space-between; position:relative;
}
.prize-item .prize-emoji { font-size:26px; margin-bottom:4px; }
.prize-item .prize-title { line-height:1.2; font-size:9px; opacity:0.9; }

.guarantee-progress {
    background:linear-gradient(155deg,#2d1155,#1a0538);
    border:2px solid #a855f7; border-radius:16px; padding:14px;
    margin-bottom:16px; text-align:center;
}
.guarantee-progress .g-title { font-size:11px; opacity:0.7; letter-spacing:1px; text-transform:uppercase; }
.guarantee-progress .g-value { font-size:18px; font-weight:900; color:#facc15; margin-top:4px; }
.progress-bar { width:100%; height:8px; background:rgba(0,0,0,0.5); border-radius:4px; margin-top:10px; overflow:hidden; }
.progress-fill {
    height:100%; background:linear-gradient(90deg,#facc15,#f59e0b);
    border-radius:4px; transition:width 0.4s;
    box-shadow:0 0 10px rgba(250,204,21,0.8);
}

.spin-btn {
    width:100%; padding:18px; font-size:16px; font-weight:900;
    letter-spacing:1px; text-transform:uppercase; border:none;
    border-radius:16px; background:linear-gradient(135deg,#facc15,#f59e0b);
    color:#000; cursor:pointer;
    box-shadow:0 0 30px rgba(250,204,21,0.6), 0 6px 20px rgba(0,0,0,0.5);
    transition:0.2s; margin-bottom:10px;
}
.spin-btn:active { transform:scale(0.97); }

.roulette-animation {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9);
    z-index:999; flex-direction:column; align-items:center;
    justify-content:center; padding:20px;
}
.roulette-animation.active { display:flex; }
.roulette-reel {
    width:100%; max-width:320px; height:120px;
    background:linear-gradient(155deg,#2d1155,#1a0538);
    border:3px solid #facc15; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 40px rgba(250,204,21,0.6);
}
.reel-item { font-size:60px; animation:slideReel 0.15s linear infinite; }
@keyframes slideReel {
    0% { transform:translateY(-20px); opacity:0; }
    50% { opacity:1; }
    100% { transform:translateY(20px); opacity:0; }
}
.roulette-result {
    margin-top:30px; text-align:center;
    animation:popIn 0.5s cubic-bezier(0.68,-0.55,0.265,1.55);
}
@keyframes popIn {
    0% { transform:scale(0); opacity:0; }
    100% { transform:scale(1); opacity:1; }
}
.roulette-result .res-emoji { font-size:70px; }
.roulette-result .res-text {
    font-size:20px; font-weight:900; margin-top:10px;
    text-shadow:0 0 20px rgba(250,204,21,0.8); text-align:center; padding:0 20px;
}

.bottom-menu {
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:space-around;
    padding:10px 0 14px; background:rgba(20,0,40,0.95);
    backdrop-filter:blur(15px);
    border-top:1px solid rgba(150,80,255,0.3); z-index:100;
}
.menu-btn {
    display:flex; flex-direction:column; align-items:center;
    gap:3px; background:none; border:none; color:#fff;
    cursor:pointer; font-size:10px; font-weight:600;
    opacity:0.5; padding:6px 20px;
}
.menu-btn.active { opacity:1; }
.menu-btn .menu-icon { font-size:22px; margin-bottom:2px; }

.toast {
    position:fixed; top:80px; left:50%;
    transform:translateX(-50%) translateY(-100px);
    background:rgba(0,0,0,0.9); border:2px solid #a855f7;
    border-radius:14px; padding:12px 20px; font-weight:700; font-size:13px;
    z-index:1000; transition:0.3s; pointer-events:none;
    text-align:center; max-width:90%;
    box-shadow:0 0 20px rgba(168,85,247,0.6);
}
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.error { border-color:#ef4444; box-shadow:0 0 20px rgba(239,68,68,0.6); }
.toast.success { border-color:#22c55e; box-shadow:0 0 20px rgba(34,197,94,0.6); }

.placeholder { padding:60px 20px; text-align:center; }
.placeholder .ph-icon { font-size:80px; margin-bottom:20px; }
.placeholder .ph-title { font-size:20px; font-weight:900; margin-bottom:10px; }
.placeholder .ph-text { font-size:13px; opacity:0.6; }
</style>
</head>
<body>

<div class="header">

<div class="roulette-animation" id="rouletteAnim">

    </div>
    <div class="roulette-result" id="rouletteResult" style="display:none;">
        <div class="res-emoji" id="resEmoji">🎁</div>
        <div class="res-text" id="resText">Вы получили...</div>
    </div>
</div>

<div class="bottom-menu">
    <button class="menu-btn active" onclick="switchTab('containers', event)">
        <div class="menu-icon">📦</div><div>Контейнеры</div>
    </button>
    <button class="menu-btn" onclick="switchTab('tasks', event)">

    </button>
    <button class="menu-btn" onclick="switchTab('auction', event)">

<div class="toast" id="toast"></div>

if (tg) { tg.ready(); tg.expand(); }

// ==================================================
// ДАННЫЕ
// ==================================================

        ]

        max_spins: 12, main_prize: "Porsche 911 Turbo S",

            { name: "BMW i8 RGB Gold", emoji: "🚗", chance: 5 },
            { name: "Aston Martin Vantage", emoji: "🚗", chance: 5 },
            { name: "Tesla Model S", emoji: "🚗", chance: 7 },
            { name: "Сумка Supreme LV", emoji: "🩳", chance: 8 },

        ]
    },
    performance: {
        name: "ПЕРФОРМАНС БОКС", emoji: "🔴", cssClass: "performance",
        base_price: 2, currency: "tickets", currency_text: "билета",
        max_spins: 12, main_prize: "Mercedes-Benz C63 AMG",
        prizes: [
            { name: "Mercedes-Benz C63 Hycade", emoji: "🚗", chance: 5 },

            { name: "Капибара", emoji: "🦫", chance: 8 },

        ]
    }
};

let CURRENT_CONTAINER = null;

// ==================================================
// ЧТЕНИЕ ДАННЫХ ИЗ URL (start_param)
// ==================================================
function readInitData() {
    // Пытаемся получить данные от бота из start_param
    let raw = null;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
        raw = tg.initDataUnsafe.start_param;
    }

    // Также проверяем query string
    if (!raw) {
        const params = new URLSearchParams(window.location.search);
        raw = params.get("data") || params.get("start");
    }

    if (!raw) return null;

    try {
        return JSON.parse(decodeURIComponent(raw));
    } catch (e) {
        console.error("Parse error:", e);
        return null;
    }
}

// ==================================================
// UI ФУНКЦИИ
// ==================================================
function updateHeader() {
    document.getElementById("statMoney").textContent = `💵 ${formatNum(USER.balance)}`;
    document.getElementById("statGcoins").textContent = `💎 ${formatNum(USER.gcoins)}`;
    document.getElementById("statTickets").textContent = `🎫 ${formatNum(USER.tickets)}`;
}

function formatNum(n) {
    return Number(n || 0).toLocaleString("ru-RU").replace(/,/g, " ");
}

function getCurrentPrice(key) {
    return CONTAINERS[key].base_price * (PROGRESS[key].count + 1);
}

function formatPrice(value, currText) {
    if (currText === "$") return formatNum(value) + " $";
    return formatNum(value) + " " + currText;
}

function renderMain() {
    const grid = document.getElementById("containersGrid");
    grid.innerHTML = "";

    for (const [key, c] of Object.entries(CONTAINERS)) {
        const price = getCurrentPrice(key);
        const priceStr = formatPrice(price, c.currency_text);

        const card = document.createElement("div");
        card.className = `container-card ${c.cssClass}`;
        card.onclick = () => openContainer(key);
        card.innerHTML = `
            <div class="container-name">КОНТЕЙНЕР</div>
            <div class="container-title">${c.name}</div>
            <div class="container-img">${c.emoji}</div>
            <div class="container-price">${priceStr}</div>
        `;
        grid.appendChild(card);
    }
}

function openContainer(key) {
    CURRENT_CONTAINER = key;
    const c = CONTAINERS[key];
    const prog = PROGRESS[key];

    document.getElementById("screenMain").style.display = "none";
    document.getElementById("screenRoulette").style.display = "block";
    document.getElementById("backBtn").style.display = "flex";
    document.getElementById("headerTitle").textContent = c.name;

    document.getElementById("mainPrizeName").textContent = c.main_prize;
    document.getElementById("mainPrizeChance").textContent = `Гарант за ${c.max_spins}`;
    document.getElementById("guaranteeCount").textContent = `${prog.current}/${c.max_spins}`;

    renderPrizes(key);
    updateProgress();
    updateSpinButton();
}

function renderPrizes(key) {
    const c = CONTAINERS[key];
    const grid = document.getElementById("prizesGrid");
    grid.innerHTML = "";
    c.prizes.forEach(p => {
        const item = document.createElement("div");
        item.className = "prize-item";
        item.innerHTML = `
            <div class="prize-emoji">${p.emoji}</div>
            <div class="prize-title">${p.name}</div>
        `;
        grid.appendChild(item);
    });
}

function updateProgress() {
    const c = CONTAINERS[CURRENT_CONTAINER];
    const prog = PROGRESS[CURRENT_CONTAINER];
    const percent = (prog.current / c.max_spins) * 100;

    document.getElementById("progressFill").style.width = percent + "%";
    document.getElementById("progressText").textContent = `${prog.current}/${c.max_spins} вращений`;
    document.getElementById("guaranteeCount").textContent = `${prog.current}/${c.max_spins}`;
}

function updateSpinButton() {
    const c = CONTAINERS[CURRENT_CONTAINER];
    const price = getCurrentPrice(CURRENT_CONTAINER);
    document.getElementById("spinBtn").textContent = `🎰 КРУТИТЬ — ${formatPrice(price, c.currency_text)}`;
}

// ==================================================
// ПРОКРУТ — отправка боту
// ==================================================
function doSpin() {
    const key = CURRENT_CONTAINER;
    const c = CONTAINERS[key];
    const price = getCurrentPrice(key);

    // Проверка баланса на клиенте
    const balanceKey = c.currency;
    if ((USER[balanceKey] || 0) < price) {
        showToast("❌ Недостаточно средств!", "error");
        return;
    }

    // Блокируем кнопку
    document.getElementById("spinBtn").disabled = true;
    document.getElementById("spinBtn").textContent = "⏳ Обработка...";

    // Отправляем боту
    if (tg) {
        tg.sendData(JSON.stringify({
            action: "spin",
            container: key
        }));
    } else {
        console.log("sendData:", key);
    }
}

// ==================================================
// ПОКАЗ РЕЗУЛЬТАТА
// ==================================================
function showRouletteResult(prize, isMain) {
    const anim = document.getElementById("rouletteAnim");
    const reel = document.getElementById("reelItem");
    const result = document.getElementById("rouletteResult");
    const emoji = document.getElementById("resEmoji");
    const text = document.getElementById("resText");

    anim.classList.add("active");
    result.style.display = "none";

    // Крутим слот
    const emojis = ["🚗","🎩","💰","👑","⚙️","🎁","🏆","🪶"];
    let step = 0;
    const interval = setInterval(() => {
        reel.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        step++;
        if (step > 15) {
            clearInterval(interval);
            reel.textContent = isMain ? "🏆" : "🎁";
            emoji.textContent = isMain ? "🏆" : "🎉";
            text.textContent = isMain ? `ГЛАВНЫЙ ПРИЗ!\n${prize}` : prize;
            result.style.display = "block";

            setTimeout(() => {
                anim.classList.remove("active");
            }, 3000);
        }
    }, 80);
}

// ==================================================
// ВКЛАДКИ
// ==================================================
function switchTab(tab, event) {
    document.querySelectorAll(".menu-btn").forEach(b => b.classList.remove("active"));
    if (event && event.currentTarget) event.currentTarget.classList.add("active");

    ["screenMain","screenRoulette","screenTasks","screenAuction"].forEach(id => {
        document.getElementById(id).style.display = "none";
    });

    if (tab === "containers") {
        document.getElementById("screenMain").style.display = "block";
        document.getElementById("headerTitle").textContent = "СЕРЫЙ ИМПОРТ";
        document.getElementById("backBtn").style.display = "none";
        CURRENT_CONTAINER = null;
        renderMain();
    } else if (tab === "tasks") {
        document.getElementById("screenTasks").style.display = "block";
        document.getElementById("headerTitle").textContent = "ЗАДАНИЯ";
        document.getElementById("backBtn").style.display = "none";
    } else if (tab === "auction") {
        document.getElementById("screenAuction").style.display = "block";
        document.getElementById("headerTitle").textContent = "АУКЦИОН";
        document.getElementById("backBtn").style.display = "none";
    }
}

function goBack() {
    if (CURRENT_CONTAINER) {
        CURRENT_CONTAINER = null;
        document.getElementById("screenRoulette").style.display = "none";
        document.getElementById("screenMain").style.display = "block";
        document.getElementById("backBtn").style.display = "none";
        document.getElementById("headerTitle").textContent = "СЕРЫЙ ИМПОРТ";
        renderMain();
    }
}

// ==================================================
// TOAST
// ==================================================
function showToast(msg, type = "") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show " + type;
    setTimeout(() => t.classList.remove("show"), 2500);
}

// ==================================================
// ЗАПУСК
// ==================================================
window.addEventListener("load", () => {
    // Читаем данные от бота
    const data = readInitData();

    if (data && data.user) {
        USER.balance = data.user.balance || 0;
        USER.gcoins = data.user.gcoins || 0;
        USER.tickets = data.user.tickets || 0;
    }

    if (data && data.progress) {
        for (const k in data.progress) {
            PROGRESS[k] = {
                current: data.progress[k].current || 0,
                total: 0,
                count: data.progress[k].count || 0
            };
        }
    }

    updateHeader();
    renderMain();

    // Если пришёл результат прокрута — показываем
    if (data && data.result && data.result.container) {
        const res = data.result;
        setTimeout(() => {
            openContainer(res.container);
            showRouletteResult(res.prize, res.is_main);
        }, 400);
    }
});
</script>
