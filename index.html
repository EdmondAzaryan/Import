<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Mobile App</title>
    <!-- Официальный скрипт Telegram Mini Apps -->
    <script src="https://telegram.org"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            text-align: center; 
            background: #1a1a1a; 
            color: #ffffff; 
        }
        .box { 
            margin-top: 40px; 
            background: #2a2a2a; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 5px; color: #2481cc; }
        input { 
            padding: 14px; 
            width: 85%; 
            margin: 20px 0; 
            border-radius: 10px; 
            border: 1px solid #444; 
            background: #333; 
            color: #fff; 
            font-size: 16px; 
        }
        button { 
            padding: 14px 24px; 
            background: #2481cc; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 92%; 
            font-size: 16px; 
        }
        button:active { background: #1f71a8; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🎪 True Grand Rp</h2>
        <p id="user-greeting">Загрузка профиля...</p>
        
        <input type="text" id="msgInput" placeholder="Введите новый никнейм...">
        <br>
        <button onclick="sendToBot()">Сохранить изменения</button>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем на весь экран

        // Показываем имя игрока, если оно доступно
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-greeting').innerText = `Игрок: ${user.first_name}`;
        }

        // Функция отправки данных обратно в бот
        function sendToBot() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text) {
                alert("Поле не может быть пустым!");
                return;
            }
            
            // Самая важная строчка: отправляет текст боту и закрывает Mini App
            tg.sendData(text); 
        }
    </script>
</body>
</html>
