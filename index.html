<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App to Bot</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        button { padding: 15px 30px; font-size: 18px; color: white; background-color: #0088cc; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #0077b5; }
    </style>
</head>
<body>

    <button id="send-btn">Отправить данные в бот</button>

    <script>
        // Инициализируем объект WebApp
        const tg = window.Telegram.WebApp;
        
        // Информируем Telegram, что приложение готово к работе
        tg.ready();

        document.getElementById('send-btn').addEventListener('click', () => {
            // Данные, которые хотим передать (лучше всего упаковать в строку JSON)
            const dataToSend = {
                status: "success",
                message: "Привет из Mini App!",
                timestamp: Date.now()
            };

            // Важно: метод работает только если Mini App открыт по кнопке KeyboardButton!
            tg.sendData(JSON.stringify(dataToSend));
        });
    </script>
</body>
</html>
